<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Southland WL | WhiteList</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="whitelist-page">
    <div class="form-card">
      <div class="form-header">
        <span class="badge">FiveM • WhiteList</span>
        <h1>WhiteList Southland WL</h1>
        <p>Remplissez votre candidature avec sérieux pour rejoindre notre communauté roleplay.</p>
      </div>

      <form class="wl-form" id="whitelistForm">
        <label>ID Discord</label>
        <input type="text" placeholder="Ex : 123456789012345678" required />

        <label>Nom du serveur</label>
        <input type="text" value="Southland WL" readonly />

        <label>Prénom HRP</label>
        <input type="text" placeholder="Votre prénom" required />

        <label>Nom HRP</label>
        <input type="text" placeholder="Votre nom" required />

        <label>Prénom RP</label>
        <input type="text" placeholder="Prénom de votre personnage" required />

        <label>Nom RP</label>
        <input type="text" placeholder="Nom de votre personnage" required />

        <label>Histoire RP</label>
        <textarea rows="4" placeholder="Décrivez votre personnage en quelques lignes" required></textarea>

        <label>Pourquoi rejoindre Southland WL ?</label>
        <textarea rows="3" placeholder="Expliquez votre motivation" required></textarea>

        <label>Disponibilité</label>
        <select required>
          <option value="">Sélectionner</option>
          <option>Très disponible</option>
          <option>Disponible en soirée</option>
          <option>Disponible ponctuellement</option>
        </select>

        <button type="submit">Envoyer ma candidature</button>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
